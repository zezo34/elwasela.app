<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة عمر ومريم في الرياضيات — الصف الرابع الابتدائي</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap');
:root{--pink:#ff6b9d;--yellow:#ffd93d;--blue:#4d96ff;--green:#56c596;--purple:#9b5de5;--orange:#ff8c42;--ink:#2d2650;--paper:#ffffff;--sky:#e9f6ff}
*{box-sizing:border-box}
body{margin:0;font-family:'Baloo Bhaijaan 2','Tajawal',Tahoma,sans-serif;color:var(--ink);font-size:19px;line-height:1.8;min-height:100vh;
 background:radial-gradient(circle at 10% 10%,#fff3c4 0,transparent 35%),radial-gradient(circle at 90% 20%,#ffd6e7 0,transparent 35%),radial-gradient(circle at 50% 100%,#d4f5e9 0,transparent 40%),linear-gradient(#f5f9ff,#fff8f0);background-attachment:fixed}
.blob{position:fixed;border-radius:50%;opacity:.35;pointer-events:none;z-index:0;animation:float 9s ease-in-out infinite}
.b1{width:220px;height:220px;background:var(--yellow);top:-60px;inset-inline-end:-40px}
.b2{width:160px;height:160px;background:var(--pink);bottom:40px;inset-inline-start:-50px;animation-delay:2s}
.b3{width:120px;height:120px;background:var(--blue);top:45%;inset-inline-end:8%;animation-delay:4s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:22px 18px 80px}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;border-radius:28px;padding:14px 20px;box-shadow:0 8px 0 #f0e6ff}
.top img{width:92px;height:92px;object-fit:contain}
.top .small{width:64px;height:64px;background:#fff;border-radius:18px;padding:4px}
.who{text-align:center;flex:1;line-height:1.7}
.who .lbl{display:block;font-size:15px;color:var(--purple);font-weight:700}
.who .nm{display:block;font-size:24px;font-weight:800;color:var(--ink)}
.who .sv{display:block;font-size:17px;font-weight:600}
.hero{background:linear-gradient(120deg,var(--blue),var(--purple));color:#fff;border-radius:34px;padding:30px;margin:22px 0;box-shadow:0 10px 0 #c7d6ff;position:relative;overflow:hidden}
.hero h1{margin:6px 0 4px;font-size:40px;font-weight:800;line-height:1.3}
.hero p{margin:0;font-size:19px;opacity:.95}
.chip{display:inline-block;background:var(--yellow);color:var(--ink);border-radius:99px;padding:2px 14px;font-weight:700;font-size:15px}
.hero .big{font-size:70px;position:absolute;inset-inline-end:18px;bottom:6px;opacity:.95}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin:10px 0 20px}
.lvl{border:0;cursor:pointer;text-align:center;border-radius:28px;padding:20px 14px 18px;color:#fff;font:inherit;box-shadow:0 8px 0 rgba(0,0,0,.12);transition:transform .15s;position:relative}
.lvl:hover{transform:translateY(-4px)}
.lvl .ico{font-size:50px;display:block;line-height:1.2}
.lvl .no{position:absolute;top:10px;inset-inline-start:14px;background:rgba(255,255,255,.3);border-radius:99px;padding:0 10px;font-size:15px;font-weight:700}
.lvl b{display:block;font-size:20px;margin-top:4px;line-height:1.4}
.lvl small{display:block;opacity:.92;font-size:15px}
.lvl .st{display:block;margin-top:6px;font-size:18px;letter-spacing:2px}
.c1{background:var(--pink)}.c2{background:var(--orange)}.c3{background:var(--green)}.c4{background:var(--blue)}.c5{background:var(--purple)}.c6{background:#f25c54}.c7{background:#00a6a6}.c8{background:#e9a700}
.examBtn{display:block;width:100%;margin:6px 0 20px;border:0;cursor:pointer;background:var(--yellow);color:var(--ink);font:inherit;font-size:24px;font-weight:800;border-radius:28px;padding:18px;box-shadow:0 8px 0 #d6b600}
.story{background:#fff;border-radius:34px;padding:26px;box-shadow:0 8px 0 #f0e6ff;margin:14px 0}
.intro{background:var(--sky);border-radius:22px;padding:14px 18px;font-size:19px;margin:0 0 14px}
.pals{display:flex;gap:12px;align-items:flex-start;margin:14px 0}
.pal{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:42px;flex:none;background:var(--yellow)}
.pal.m{background:var(--pink)}
.bub{background:#f7f4ff;border-radius:24px;padding:12px 18px;position:relative;flex:1}
.bub b{color:var(--purple);font-size:17px}
.bub p{margin:2px 0 0;font-size:20px}
.game{border:3px dashed var(--orange);border-radius:26px;padding:18px;margin:18px 0;background:#fffdf7}
.game .tag{display:inline-block;background:var(--orange);color:#fff;border-radius:99px;padding:0 14px;font-size:15px;font-weight:700}
.game .qq{font-size:22px;font-weight:800;margin:8px 0 12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.ob{border:2px solid #ddd3f5;background:#fff;border-radius:18px;padding:12px;font:inherit;font-size:20px;font-weight:700;cursor:pointer;color:var(--ink)}
.ob:hover:not(:disabled){border-color:var(--purple);transform:translateY(-2px)}
.ob.sel{background:#efe7ff;border-color:var(--purple)}
.ob:disabled{cursor:default}
.inp{font:inherit;font-size:26px;font-weight:800;width:180px;padding:8px 12px;border:2px solid #ddd3f5;border-radius:16px;text-align:center;direction:ltr}
.gbtn{font:inherit;font-weight:800;font-size:19px;border:0;border-radius:18px;padding:10px 22px;background:var(--green);color:#fff;cursor:pointer;box-shadow:0 5px 0 #3da67b;margin-top:8px}
.gbtn.alt{background:var(--blue);box-shadow:0 5px 0 #2f74d4}
.gbtn:disabled{opacity:.5;box-shadow:none;cursor:default}
.fb{display:inline-block;margin-inline-start:10px;font-weight:800;font-size:19px;color:var(--purple)}
.result{background:linear-gradient(120deg,var(--yellow),#ffb86b);border-radius:28px;padding:20px;margin:18px 0;text-align:center;box-shadow:0 8px 0 #e6a33a}
.result .sc{font-size:30px;font-weight:800}
.result .stars{font-size:38px;letter-spacing:6px}
.nav2{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.navb{font:inherit;font-weight:800;font-size:18px;border:0;border-radius:18px;padding:10px 18px;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 5px 0 #e4dcf5}
.navb.p{background:var(--pink);color:#fff;box-shadow:0 5px 0 #d94d7d}
.about .logos{display:flex;gap:18px;justify-content:center;align-items:center;flex-wrap:wrap;background:#fff;border-radius:28px;padding:18px;margin:14px 0;box-shadow:0 8px 0 #f0e6ff}
.about .logos img{width:150px;height:150px;object-fit:contain}
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:12px}
.person{background:#fff;border-radius:26px;padding:20px;text-align:center;box-shadow:0 8px 0 #f0e6ff}
.person .av{font-size:50px}
.person b{display:block;font-size:20px}
.person small{color:#7a7196;font-size:15px}
h1.t{font-size:38px;margin:4px 0 8px;font-weight:800;color:var(--purple)}
h2{font-size:26px;margin:20px 0 6px;color:var(--ink)}
.hidden{display:none}
@media (max-width:640px){
 body{font-size:17px}
 .top img{width:62px;height:62px}
 .top .small{width:48px;height:48px}
 .who .nm{font-size:19px}
 .hero h1{font-size:28px}
 .hero .big{display:none}
 .pal{width:56px;height:56px;font-size:30px}
 .inp{width:140px}
}
</style>
</head>

<script>
const SUPERVISORS=['Somaya Refaat','Dr. Marwa Gouda'];   // ← عدّل أسماء المشرفين هنا
const STUDENT='هدى ياسر حسن';
const $=id=>document.getElementById(id);
const ST={},UDONE={};
const ICONS=['🐜','🛒','📏','🟩','🍎','📦','🛍️','🧮'];
const COLS=['c1','c2','c3','c4','c5','c6','c7','c8'];
const ROUTES=['home',...UNITS.map((_,i)=>'u'+(i+1)),'exam','about'];
function getUnit(id){return id==='exam'?EXAM:UNITS[+id.slice(1)-1];}
function starsFor(score,total){
  const n=total?Math.round(score/total*5):0;
  return '⭐'.repeat(n)+'☆'.repeat(5-n);
}
function sayHTML(s){
  const girl=s[1]!=='عمر';
  return `<div class="pals"><div class="pal ${girl?'m':''}">${girl?'👧':'🧒'}</div><div class="bub"><b>${s[1]}</b><p>${s[2]}</p></div></div>`;
}
function actHTML(uid,si,s){
  const key=uid+'_'+si;
  ST[key]=ST[key]||{done:false,first:null};
  const d=ST[key].done;
  if(s[0]==='choice'){
    return `<div class="game"><span class="tag">🎯 سؤال</span><div class="qq">${s[1]}</div>`+
      `<div class="opts">`+s[2].map((o,k)=>`<button class="ob" id="o_${key}_${k}" ${d?'disabled':''} onclick="pick('${key}',${k})">${o}</button>`).join('')+`</div>`+
      `<button class="gbtn" id="ck_${key}" ${d?'disabled':''} onclick="checkChoice('${uid}',${si})">تحقق</button><span class="fb" id="fb_${key}">${d?'✔ أحسنت!':''}</span></div>`;
  }
  return `<div class="game"><span class="tag">✏️ مسألة</span><div class="qq">${s[1]}</div>`+
    `<input class="inp" id="in_${key}" type="number" ${d?'disabled':''}> `+
    `<button class="gbtn alt" id="ck_${key}" ${d?'disabled':''} onclick="checkInput('${uid}',${si})">تحقق</button><span class="fb" id="fb_${key}">${d?'✔ أحسنت!':''}</span></div>`;
}
function pick(key,k){
  if(ST[key].done) return;
  ST[key].sel=k;
  document.querySelectorAll(`[id^="o_${key}_"]`).forEach((b,j)=>b.classList.toggle('sel',j===k));
}
function judge(uid,si,ok){
  const key=uid+'_'+si, st=ST[key];
  if(st.first===null) st.first=ok;
  $('fb_'+key).textContent = ok ? '✔ أحسنت!' : '🔁 جرّب تاني';
  if(ok) lockKey(key);
}
function lockKey(key){
  ST[key].done=true;
  document.querySelectorAll(`[id^="o_${key}_"]`).forEach(b=>b.disabled=true);
  const i=$('in_'+key); if(i) i.disabled=true;
  const c=$('ck_'+key); if(c) c.disabled=true;
}
function checkChoice(uid,si){
  const key=uid+'_'+si, s=getUnit(uid).s[si];
  if(ST[key].sel===undefined){ $('fb_'+key).textContent='اختار إجابة الأول 🙂'; return; }
  judge(uid,si,ST[key].sel===s[3]);
}
function checkInput(uid,si){
  const key=uid+'_'+si, s=getUnit(uid).s[si];
  const v=$('in_'+key).value.trim();
  if(v===''){ $('fb_'+key).textContent='اكتب الإجابة الأول 🙂'; return; }
  judge(uid,si,+v===s[2]);
}
function finishUnit(uid){
  const U=getUnit(uid);
  const items=U.s.map((s,si)=>si).filter(si=>U.s[si][0]!=='say');
  const undone=items.filter(si=>!ST[uid+'_'+si].done);
  if(undone.length && !confirm('لسه فيه '+undone.length+' مسألة. تحب تنهي الوحدة؟')) return;
  const first=items.filter(si=>ST[uid+'_'+si].first===true).length;
  UDONE[uid]={score:first,total:items.length};
  $('end_'+uid).innerHTML=resultHTML(uid);
  updateNav();
}
function resultHTML(uid){
  const r=UDONE[uid];
  if(!r) return `<div class="result"><button class="gbtn" onclick="finishUnit('${uid}')">🏁 خلصت الوحدة، وريني نتيجتي</button></div>`;
  return `<div class="result"><div class="sc">نتيجتك: ${r.score} من ${r.total}</div><div class="stars">${starsFor(r.score,r.total)}</div><p>عدد الأسئلة اللي حليتها صح من أول مرة</p></div>`;
}
function unitView(uid){
  const U=getUnit(uid), n=parseInt(uid.slice(1))||0;
  const head = uid==='exam'?'🏆 اختبار الوحدات':`${ICONS[n-1]} الوحدة ${n}`;
  const body=U.s.map((s,si)=>s[0]==='say'?sayHTML(s):actHTML(uid,si,s)).join('');
  const nav = uid==='exam'
    ? `<button class="navb" onclick="go('u8')">⬅ الوحدة 8</button><button class="navb p" onclick="go('home')">🏠 الرئيسية</button>`
    : `<button class="navb" onclick="go('${n>1?'u'+(n-1):'home'}')">⬅ ${n>1?'الوحدة السابقة':'الرئيسية'}</button>`+
      `<button class="navb p" onclick="go('${n<8?'u'+(n+1):'exam'}')">${n<8?'الوحدة الجاية ➡':'الاختبار 🏆'}</button>`;
  return `<span class="chip">${U.sub}</span><h1 class="t">${head}</h1>
    <div class="story"><p class="intro">${U.intro}</p>${body}
    <div id="end_${uid}">${resultHTML(uid)}</div></div>
    <div class="nav2">${nav}</div>`;
}
